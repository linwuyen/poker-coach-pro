name: V4 Finalize

on:
  push:
    branches: [agent/v4-truth-transfer-effects]

permissions:
  contents: write

concurrency:
  group: v4-finalize
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v4-truth-transfer-effects
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply v4 version and copy cleanup
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '4.0.0';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = '4.0.0';
          if (lock.packages?.['']) lock.packages[''].version = '4.0.0';
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          const appPath = 'src/app/AppV2.tsx';
          let app = fs.readFileSync(appPath, 'utf8');
          app = app.replace('title="未見題 Benchmark" description="只看尚未作答的題，測量真實泛化"', 'title="未見題探索" description="一般訓練池的未見題；真正 Holdout 請使用 Hidden Benchmark"');
          fs.writeFileSync(appPath, app);
          NODE
      - name: Commit finalization
        run: |
          if git diff --quiet; then
            echo "v4 finalization already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/app/AppV2.tsx
          git commit -m "chore: finalize v4 version and benchmark copy"
          git push origin HEAD:agent/v4-truth-transfer-effects
