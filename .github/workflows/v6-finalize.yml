name: V6 Decision Tutor Finalize

on:
  push:
    branches: [agent/v6-decision-tutor]

permissions:
  contents: write

concurrency:
  group: v6-decision-tutor-finalize
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v6-decision-tutor
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply v6 product wiring
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const appPath = 'src/app/AppV2.tsx';
          let app = fs.readFileSync(appPath, 'utf8');
          app = app.replace("benchmark: '未見基準題'", "benchmark: '泛化探索'");
          app = app.replace(
            "  const bestImprovement = [...weaknesses].sort((a, b) => b.recentTrend - a.recentTrend)[0];",
            "  const bestImprovement = [...weaknesses].sort((a, b) => b.recentTrend - a.recentTrend)[0];\n  const nextBest = dailyPlan.items[0];"
          );
          app = app.replace('完成 {dailyPlan.items.length} 題個人化提取練習', "{nextBest ? nextBest.scenario.title : `完成 ${dailyPlan.items.length} 題個人化提取練習`}");
          app = app.replace(
            '依你的 {profile.formats.join(\'/\')}、{profile.stackBands.join(\'/\')} 籌碼、到期節點、掌握度與未見題自動組合。答錯後不會立即重出。',
            '先回答一件事：下一分鐘練什麼最能降低未來 EV loss。排程同時看錯誤成本、spot 頻率、可改善機率、遺忘風險與 transfer value。'
          );
          app = app.replace(
            '<div className="mt-4 space-y-3">{(Object.entries(dailyPlan.counts)',
            '<div className="mt-4 space-y-3">{nextBest && <div className="rounded-xl border border-emerald-500/20 bg-emerald-500/7 p-3"><div className="text-xs text-slate-500">Expected EV Gain / 100 hands</div><div className="mt-1 font-mono text-xl font-bold text-emerald-300">+{(nextBest.expectedEvGainPer100Hands || 0).toFixed(3)}BB</div></div>}{(Object.entries(dailyPlan.counts)'
          );
          app = app.replace(
            '預設使用系統推薦。專項訓練仍會記錄信心、掌握度與延遲留存。</p></div><div className="grid gap-4 md:grid-cols-2 xl:grid-cols-3">',
            '預設使用系統推薦。專項訓練仍會記錄信心、掌握度與延遲留存。</p><div className="mt-4 flex flex-wrap gap-2"><button type="button" onClick={() => { window.location.hash = \'contrastive-trainer\'; }} className="rounded-xl border border-fuchsia-500/30 bg-fuchsia-500/8 px-3 py-2 text-xs text-fuchsia-200">Contrastive</button><button type="button" onClick={() => { window.location.hash = \'boundary-map\'; }} className="rounded-xl border border-violet-500/30 bg-violet-500/8 px-3 py-2 text-xs text-violet-200">Boundary Map</button><button type="button" onClick={() => { window.location.hash = \'solver-benchmark\'; }} className="rounded-xl border border-amber-500/30 bg-amber-500/8 px-3 py-2 text-xs text-amber-200">Solver Holdout</button></div></div><div className="grid gap-4 md:grid-cols-2 xl:grid-cols-3">'
          );
          const oldLearn = 'function LearnPage() { return <div className="space-y-6"><button type="button" onClick={() => { window.location.hash = \'solver-corpus\'; }} className="pc-hero-glow pc-card-lift w-full rounded-2xl border border-blue-500/25 bg-blue-500/8 p-5 text-left"><div className="text-xs font-semibold uppercase tracking-[0.18em] text-blue-300">Verified Solver Corpus</div><div className="mt-2 text-xl font-semibold text-white">PokerBench · 11,000 solver-computed decision rows</div><div className="mt-2 text-sm leading-6 text-slate-400">直接訓練 Preflop / Postflop optimal decision 與下注尺寸；來源固定 revision、Apache-2.0，缺少 per-action EV 時不製造假 EV。</div></button><StrategyExplorer /><section className="grid gap-4 md:grid-cols-3"><LearningCard title="底池賠率" description="跟注成本、最低勝率與 EV loss。" status="Exact / 題庫" /><LearningCard title="SPR 決策" description="依底池與有效籌碼理解承諾程度。" status="Mastery 節點" /><LearningCard title="Blocker 組合" description="由組合削減連結到策略頻率與反轉條件。" status="Strategy v2.2" /></section></div>; }';
          const newLearn = 'function LearnPage() { return <div className="space-y-6"><section className="grid gap-4 md:grid-cols-2"><button type="button" onClick={() => { window.location.hash = \'solver-corpus\'; }} className="pc-hero-glow pc-card-lift rounded-2xl border border-blue-500/25 bg-blue-500/8 p-5 text-left"><div className="text-xs font-semibold uppercase tracking-[0.18em] text-blue-300">Verified Solver Curriculum</div><div className="mt-2 text-xl font-semibold text-white">PokerBench · Training 80%</div><div className="mt-2 text-sm leading-6 text-slate-400">Level 1→4 curriculum、Explain-before-reveal、嚴格 provenance。</div></button><button type="button" onClick={() => { window.location.hash = \'strategy-surface\'; }} className="pc-card-lift rounded-2xl border border-cyan-500/25 bg-cyan-500/8 p-5 text-left"><div className="text-xs font-semibold uppercase tracking-[0.18em] text-cyan-300">Full Strategy Surface</div><div className="mt-2 text-xl font-semibold text-white">Frequency × EV × Context</div><div className="mt-2 text-sm leading-6 text-slate-400">有 frequency 就算 Strategy Distance；有 action EV 才算 regret；重大 context mismatch 直接 unsupported。</div></button></section><StrategyExplorer /><section className="grid gap-4 md:grid-cols-3"><LearningCard title="Decision Boundary" description="從下注尺寸／equity 找 Call/Fold 反轉點。" status="Exact Math" /><LearningCard title="Board Texture" description="Pairing、tone、connectivity、dynamicity 結構化。" status="Context Engine" /><LearningCard title="Calibration" description="把信心與真實正確率分開衡量。" status="Student Model" /></section></div>; }';
          if (app.includes(oldLearn)) app = app.replace(oldLearn, newLearn);
          app = app.replace('<HandLab /><Panel title="最近決策"', '<button type="button" onClick={() => { window.location.hash = \'calibration\'; }} className="pc-card-lift w-full rounded-2xl border border-cyan-500/20 bg-cyan-500/6 p-5 text-left"><div className="text-xs uppercase tracking-[0.18em] text-cyan-300">Calibration & Error Model</div><div className="mt-2 text-lg font-semibold">找出高信心錯誤、猜中與脆弱知識</div></button><HandLab /><Panel title="最近決策"');
          fs.writeFileSync(appPath, app);

          const enginePath = 'src/strategy-engine-v2/engine.ts';
          let engine = fs.readFileSync(enginePath, 'utf8');
          const marker = '  const match = findBestProfile(candidates, query);\n  const stackDistance';
          if (engine.includes(marker) && !engine.includes('materialContextMismatches')) {
            engine = engine.replace(marker, `  const match = findBestProfile(candidates, query);\n  const materialContextMismatches: string[] = [];\n  if (query.stackDepthBB !== undefined && Math.abs(match.profile.context.stackDepthBB - query.stackDepthBB) > 5) materialContextMismatches.push('stackDepthBB');\n  if (query.anteBB !== undefined && Math.abs(match.profile.context.anteBB - query.anteBB) > 0.05) materialContextMismatches.push('anteBB');\n  if (query.openSizeBB !== undefined && (match.profile.context.openSizeBB === undefined || Math.abs(match.profile.context.openSizeBB - query.openSizeBB) > 0.25)) materialContextMismatches.push('openSizeBB');\n  if (query.rakePercent !== undefined && (match.profile.context.rakePercent === undefined || Math.abs(match.profile.context.rakePercent - query.rakePercent) > 0.5)) materialContextMismatches.push('rakePercent');\n  if (query.rakeCapBB !== undefined && (match.profile.context.rakeCapBB === undefined || Math.abs(match.profile.context.rakeCapBB - query.rakeCapBB) > 0.25)) materialContextMismatches.push('rakeCapBB');\n  if (materialContextMismatches.length && !query.allowApproximate) return { status: 'unsupported', missingContexts: materialContextMismatches, warnings: ['策略情境存在重大 mismatch；系統拒絕把近似節點冒充 exact solver truth。'] };\n  if (materialContextMismatches.length) match.warnings.push(\`Approximate context: \${materialContextMismatches.join(', ')}\`);\n  const stackDistance`);
          }
          fs.writeFileSync(enginePath, engine);

          const pkgPath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.version = '6.0.0';
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          const lockPath = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          lock.version = '6.0.0';
          if (lock.packages?.['']) lock.packages[''].version = '6.0.0';
          fs.writeFileSync(lockPath, JSON.stringify(lock, null, 2) + '\n');

          const readmePath = 'README.md';
          let readme = fs.readFileSync(readmePath, 'utf8');
          readme = readme.replace('**v5 Solver Truth Engine · Strategy Engine v2.2**', '**v6 Decision Tutor · Strategy Engine v2.3**');
          if (!readme.includes('## 🧭 v6 Decision Tutor')) readme = readme.replace('## 🧠 v4 核心能力', `## 🧭 v6 Decision Tutor\n\n- **Expected EV Gain Scheduler**：排序目標從 learning value 進一步改成 expected loss × spot frequency × probability of improvement，再納入 retention / transfer / time cost。\n- **Strict Context Fingerprint**：Position、street、action tree、pot bucket、board texture，以及 Strategy Profile 的 stack/open/rake/ante 都可產生 deterministic fingerprint；重大 mismatch 直接 unsupported。\n- **Strategy-Distance Learning**：完整 frequency profile 以 total-variation distance 評分，不把 55/45 mixed strategy 簡化成單一答案；只有真實 action EV 存在才計算 strategy EV regret。\n- **Solver Curriculum**：PokerBench 固定分成 Training 80% / Sibling 10% / Holdout 10%；正常訓練看不到 sibling/holdout。Level 1→4 由簡單 pure decision 逐步進到 sizing / complex boundary。\n- **Contrastive Trainer**：只使用 sibling partition，配對看起來相似但 solver label 不同的 spot，找真正改變答案的 context。\n- **Solver Holdout Benchmark**：只使用從未進 normal training 的 10% holdout，和舊 Scenario Hidden Benchmark 分開。\n- **Explain-before-reveal**：先選 action、推理假設、confidence，再看 solver label；PokerBench 沒有 reason ground truth，所以理由只作 mental-model diagnosis，不偽造 solver explanation。\n- **Board Texture Engine**：Pairing、tone、high card、broadway density、straight connectivity、suit concentration、dynamicity 進入 Situation Graph。\n- **Calibration & Error Model**：區分 knowledge gap、mental-model、sizing boundary、action boundary、lucky guess、fragile knowledge，並計算 confidence calibration / ECE。\n- **Decision Boundary Map**：用 exact pot-odds math 顯示下注尺寸改變時 Call/Fold 門檻在哪裡翻轉。\n- **UI 收斂**：Today 先顯示下一個最高 Expected EV Gain drill；進階工具退到 Train/Learn/Analysis 二級入口。\n\n> 公開 PokerBench 仍只提供 optimal decision label，沒有每個 action 的完整 frequency/EV surface。v6 已把完整 surface 的資料模型、import/profile scoring、Strategy Distance 與 EV regret 做完；缺資料時顯示 unavailable，而不是製造數字。\n\n## 🧠 v4 核心能力`);
          readme = readme.replace('- App version: `5.0.0`', '- App version: `6.0.0`');
          fs.writeFileSync(readmePath, readme);
          NODE
      - name: Commit finalization
        run: |
          if git diff --quiet; then
            echo "v6 finalization already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/AppV2.tsx src/strategy-engine-v2/engine.ts package.json package-lock.json README.md
          git commit -m "feat: wire v6 decision tutor into product"
          git push origin HEAD:agent/v6-decision-tutor
