name: Refresh dependency lock

on:
  push:
    branches: [agent/finish-v3-production]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-lock-agent-finish-v3-production
  cancel-in-progress: true

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/finish-v3-production

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Refresh lockfile and apply compatible security fixes
        run: |
          npm install --package-lock-only
          npm audit fix --package-lock-only
          npm audit --audit-level=high

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh secure dependency lock"
          git push origin HEAD:agent/finish-v3-production
