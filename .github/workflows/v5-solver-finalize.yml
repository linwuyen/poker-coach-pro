name: V5 Solver Finalize

on:
  push:
    branches: [agent/v5-pokerbench-truth]

permissions:
  contents: write

concurrency:
  group: v5-solver-finalize
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v5-pokerbench-truth
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply v5 product wiring
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const strategyPath = 'src/features/strategy/StrategyExplorer.tsx';
          let strategy = fs.readFileSync(strategyPath, 'utf8');
          strategy = strategy.replace('Strategy Engine v2.1', 'Strategy Engine v2.2');
          strategy = strategy.replace('節點、位置、籌碼、Ante、Rake、下注樹、EV 與資料可信度皆屬於 Profile；沒有對應節點時，查詢 API 會拒絕用其他策略代答。', 'Range Profile 仍可用於頻率矩陣，但內建 heuristic 只做 fallback。Solver-computed 單點決策改由 PokerBench Corpus 提供，沒有對應真值時不以 heuristic 冒充 verified solver。');
          if (!strategy.includes('PokerBench Solver')) {
            strategy = strategy.replace(
              '<button type="button" onClick={() => importRef.current?.click()} className="flex items-center gap-2 rounded-lg border border-emerald-500/30 px-3 py-2 text-xs text-emerald-300"><Upload className="h-4 w-4" />匯入 Solver</button><input',
              '<button type="button" onClick={() => importRef.current?.click()} className="flex items-center gap-2 rounded-lg border border-emerald-500/30 px-3 py-2 text-xs text-emerald-300"><Upload className="h-4 w-4" />匯入 Solver</button><button type="button" onClick={() => { window.location.hash = \'solver-corpus\'; }} className="pc-interactive flex items-center gap-2 rounded-lg border border-blue-500/30 bg-blue-500/8 px-3 py-2 text-xs text-blue-200"><Database className="h-4 w-4" />PokerBench Solver</button><input'
            );
          }
          fs.writeFileSync(strategyPath, strategy);

          const appPath = 'src/app/AppV2.tsx';
          let app = fs.readFileSync(appPath, 'utf8');
          const oldLearn = 'function LearnPage() { return <div className="space-y-6"><StrategyExplorer /><section className="grid gap-4 md:grid-cols-3"><LearningCard title="底池賠率" description="跟注成本、最低勝率與 EV loss。" status="題庫＋解析支援" /><LearningCard title="SPR 決策" description="依底池與有效籌碼理解承諾程度。" status="Mastery 節點" /><LearningCard title="Blocker 組合" description="由組合削減連結到策略頻率與反轉條件。" status="Strategy v2.1" /></section></div>; }';
          const newLearn = 'function LearnPage() { return <div className="space-y-6"><button type="button" onClick={() => { window.location.hash = \'solver-corpus\'; }} className="pc-hero-glow pc-card-lift w-full rounded-2xl border border-blue-500/25 bg-blue-500/8 p-5 text-left"><div className="text-xs font-semibold uppercase tracking-[0.18em] text-blue-300">Verified Solver Corpus</div><div className="mt-2 text-xl font-semibold text-white">PokerBench · 11,000 solver-computed decision rows</div><div className="mt-2 text-sm leading-6 text-slate-400">直接訓練 Preflop / Postflop optimal decision 與下注尺寸；來源固定 revision、Apache-2.0，缺少 per-action EV 時不製造假 EV。</div></button><StrategyExplorer /><section className="grid gap-4 md:grid-cols-3"><LearningCard title="底池賠率" description="跟注成本、最低勝率與 EV loss。" status="Exact / 題庫" /><LearningCard title="SPR 決策" description="依底池與有效籌碼理解承諾程度。" status="Mastery 節點" /><LearningCard title="Blocker 組合" description="由組合削減連結到策略頻率與反轉條件。" status="Strategy v2.2" /></section></div>; }';
          if (app.includes(oldLearn)) app = app.replace(oldLearn, newLearn);
          fs.writeFileSync(appPath, app);

          const pkgPath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.version = '5.0.0';
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

          const lockPath = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          lock.version = '5.0.0';
          if (lock.packages?.['']) lock.packages[''].version = '5.0.0';
          fs.writeFileSync(lockPath, JSON.stringify(lock, null, 2) + '\n');

          const readmePath = 'README.md';
          let readme = fs.readFileSync(readmePath, 'utf8');
          readme = readme.replace('**v4 Truth & Transfer Engine · Strategy Engine v2.1**', '**v5 Solver Truth Engine · Strategy Engine v2.2**');
          readme = readme.replace('## ✨ v4 視覺系統', `## ♠️ v5 Solver Truth\n\n- PokerBench pinned solver corpus：使用 Apache-2.0 的 solver-computed NLHE decisions，固定 dataset revision。\n- Preflop 1,000 + Postflop 10,000 lightweight solver rows 直接在 GitHub Pages lazy-load，並使用 Cache Storage。\n- Solver row 會保存 source id、revision、license、split、row id 到 History，答案可追溯。\n- Sizing Trainer 已移除手填 heuristic EV，改以資料集實際的 Bet/Raise size label 作答。\n- PokerBench 沒有提供 per-action EV / mixed frequency 時，產品明確留白，不計算假 EV regret。\n- 原本內建 heuristic range 仍可作教學 fallback，但不再冒充 verified solver。\n\n## ✨ v4 視覺系統`);
          readme = readme.replace('- App version: `4.0.0`', '- App version: `5.0.0`');
          fs.writeFileSync(readmePath, readme);
          NODE
      - name: Commit finalization
        run: |
          if git diff --quiet; then
            echo "v5 finalization already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/strategy/StrategyExplorer.tsx src/app/AppV2.tsx package.json package-lock.json README.md
          git commit -m "feat: wire v5 solver truth into product"
          git push origin HEAD:agent/v5-pokerbench-truth
