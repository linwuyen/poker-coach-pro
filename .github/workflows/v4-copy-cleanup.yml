name: V4 Copy Cleanup

on:
  push:
    branches: [agent/v4-truth-transfer-effects]

permissions:
  contents: write

concurrency:
  group: v4-copy-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v4-truth-transfer-effects
      - name: Rename normal unseen pool
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'src/app/AppV2.tsx';
          let text = fs.readFileSync(path, 'utf8');
          text = text.replace("{ title: '未見題 Benchmark', description: '只看尚未作答的題，測量真實泛化'", "{ title: '未見題探索', description: '一般訓練池的未見題；真正 Holdout 請使用 Hidden Benchmark'");
          fs.writeFileSync(path, text);
          NODE
      - name: Commit cleanup
        run: |
          if git diff --quiet -- src/app/AppV2.tsx; then
            echo "copy already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/AppV2.tsx
          git commit -m "copy: distinguish unseen exploration from holdout benchmark"
          git push origin HEAD:agent/v4-truth-transfer-effects
