name: Persistent Settings Refactor

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify codemod is fully applied
        run: node scripts/refactor-persistent-settings.mjs

      - name: Validate application
        run: npm run check && npm run build:web
