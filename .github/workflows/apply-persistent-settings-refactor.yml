name: Apply Persistent Settings Refactor

on:
  push:
    branches:
      - agent/extract-persistent-settings-20260805

permissions:
  contents: write

jobs:
  refactor-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/extract-persistent-settings-20260805
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply idempotent codemod
        run: node scripts/refactor-persistent-settings.mjs --write

      - name: Validate application
        run: npm run check && npm run build:web

      - name: Commit generated App extraction
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No codemod changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "refactor(settings): apply persistent state extraction"
          git push origin HEAD:agent/extract-persistent-settings-20260805
