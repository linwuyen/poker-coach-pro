name: State Persistence Regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Validate persistence contracts
        run: npx tsx --test tests/settingsPersistence.test.ts tests/history.test.ts

      - name: Type-check persistence integration
        run: npm run lint
